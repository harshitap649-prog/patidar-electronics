<!doctype html>
<html>
<head><meta charset="utf-8"><title>smoke</title></head>
<body>
<pre id="out">STARTED</pre>
<iframe id="f" style="width:1200px;height:800px"></iframe>
<script>
(function () {
  var out = [];
  var el = document.getElementById("out");
  var log = function (m) { out.push(m); el.textContent = out.join("\n"); };
  var f = document.getElementById("f");
  var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  var page = new URLSearchParams(location.search).get("page") || "category.html?type=tvs";
  window.__errs = [];
  window.addEventListener("error", function (e) { window.__errs.push(e.message); });

  // Pre-seed session cache so restore path is exercised (category page).
  if (page.indexOf("category") === 0) {
    try {
      sessionStorage.setItem("patidar-perf:v1:category-ui-v1",
        JSON.stringify({ query: "samsung", sort: "low-to-high", priceRange: null, type: "tvs" }));
    } catch (e) { log("seed fail: " + e.message); }
  }

  f.addEventListener("load", function () {
    // Ignore about:blank / self loads; only run once the real page is in.
    var href = "";
    try { href = f.contentWindow.location.href; } catch (e) { href = ""; }
    if (href.indexOf(page.split("?")[0]) === -1) return;
    var run = async function () {
      try {
        var d = f.contentDocument, w = f.contentWindow;
        await sleep(600);

        log("page: " + page);
        log("perf loaded: " + (!!w.PatidarPerf));
        log("errors: " + (window.__errs.length ? window.__errs.join(" | ") : "none"));

        if (page.indexOf("category") === 0) {
        log("restored query: '" + d.getElementById("searchInput").value + "'");
        log("restored sort: " + d.getElementById("sidebarSort").value);
        var n = d.querySelectorAll(".product-card").length;
        log("cards after restore(search=samsung): " + n);
        var cnt = d.getElementById("resultCount").textContent.replace(/\s+/g, " ").trim();
        log("resultCount: " + cnt);

        // Clear -> full list back
        d.querySelector('[data-action="clear-search"]').click();
        await sleep(150);
        n = d.querySelectorAll(".product-card").length;
        log("cards after clear: " + n + " box='" + d.getElementById("searchInput").value + "'");

        // Typing: debounced single render
        var box = d.getElementById("searchInput");
        w.__inputFired = 0;
        w.__debounceProbe = 0;
        d.addEventListener("input", function () { w.__inputFired++; }, { capture: true });
        w.addEventListener("error", function (e) { log("PAGE ERROR: " + e.message); });
        // Trace whether PatidarPerf.debounce-wrapped fn ever fires
        var origDebounce = w.PatidarPerf.debounce;
        w.PatidarPerf.debounce = function (fn, wait) {
          var wrapped = origDebounce(function () { w.__debounceProbe++; fn.apply(this, arguments); }, wait);
          return wrapped;
        };
        // Probe: does rAF fire inside the iframe under this headless mode?
        w.__rafFired = 0;
        w.requestAnimationFrame(function () { w.__rafFired = 1; });
        await sleep(600);
        log("iframe rAF fired: " + w.__rafFired);
        log("rafRender src: " + w.PatidarPerf.rafRender.toString().replace(/\s+/g, " ").slice(0, 300));
        box.value = "boat";
        box.dispatchEvent(new w.Event("input", { bubbles: true }));
        await sleep(500);
        log("typed search cards: " +
            d.querySelectorAll(".product-card").length +
            " resultCount: " + d.getElementById("resultCount").textContent.replace(/\s+/g, " ").trim());
        // Direct call path check
        w.handleSearch();
        await sleep(100);
        log("after direct handleSearch cards: " + d.querySelectorAll(".product-card").length +
            " resultCount: " + d.getElementById("resultCount").textContent.replace(/\s+/g, " ").trim());
        box.value = "";
        box.dispatchEvent(new w.Event("input", { bubbles: true }));
        await sleep(500);
        log("after empty input cards: " + d.querySelectorAll(".product-card").length);

        // Clear again, then price chip
        d.querySelector('[data-action="clear-search"]').click();
        await sleep(150);
        var chip = d.querySelector('.filter-chip[data-price="under20k"]');
        chip.click();
        await sleep(150);
        log("chip active: " + chip.classList.contains("active") +
            " cards: " + d.querySelectorAll(".product-card").length +
            " minPrice synced: " + d.getElementById("minPrice").value);

        // Sidebar sort via inline onchange path
        var sel = d.getElementById("sidebarSort");
        sel.value = "high-to-low";
        sel.dispatchEvent(new w.Event("change", { bubbles: true }));
        await sleep(150);
        var first = d.querySelector(".product-card .product-price");
        log("sorted cards: " + d.querySelectorAll(".product-card").length +
            " first price: " + (first ? first.textContent : "none"));

        // Wishlist delegation on grid
        var heart = d.querySelector("[data-wishlist-id]");
        if (heart) {
          heart.click();
          await sleep(80);
          log("wishlist active class: " + (heart.className.indexOf("active") !== -1 || heart.className.indexOf("wish") !== -1) +
              " cls=" + heart.className);
        } else { log("wishlist: NO BUTTON"); }

        // Compare delegation
        var cb = d.querySelector(".compare-checkbox");
        if (cb) {
          cb.checked = true;
          cb.dispatchEvent(new w.Event("change", { bubbles: true }));
          await sleep(80);
          log("compare btn disabled after check: " + d.getElementById("compareBtn").disabled);
        } else { log("compare: NO CHECKBOX"); }

        // Reset filters
        var reset = d.getElementById("resetFilters");
        if (reset && reset.style.display !== "none") {
          reset.click();
          await sleep(150);
          log("after reset cards: " + d.querySelectorAll(".product-card").length +
              " sort=" + d.getElementById("sidebarSort").value);
        } else { log("reset: hidden (not filtered?) display=" + reset.style.display); }

        } else if (page.indexOf("index") === 0) {
          // Home page: categories search (debounced via Perf) + prefetch wiring.
          var catCards = d.querySelectorAll(".modal-category-item");
          log("modal category items: " + catCards.length);
          var cbox = d.getElementById("categoriesSearch");
          if (cbox) {
            cbox.value = "tv";
            cbox.dispatchEvent(new w.Event("input", { bubbles: true }));
            await sleep(500);
            var vis = 0;
            Array.prototype.forEach.call(catCards, function (c) {
              if (c.style.display !== "none") vis++;
            });
            log("cat search 'tv' visible: " + vis + " of " + catCards.length);
            cbox.value = "";
            cbox.dispatchEvent(new w.Event("input", { bubbles: true }));
            await sleep(400);
          } else { log("categoriesSearch: MISSING"); }
        } else {
          // mobiles.html: delegation flag + search via Perf debounce/rafRender.
          var grid = d.getElementById("productsGrid");
          log("cards: " + d.querySelectorAll(".product-card").length +
              " delegated: " + (grid && grid.dataset.delegated === "1"));
          var mbox = d.getElementById("searchInput");
          if (mbox) {
            mbox.value = "oppo";
            mbox.dispatchEvent(new w.Event("input", { bubbles: true }));
            await sleep(500);
            log("search oppo cards: " + d.querySelectorAll(".product-card").length +
                " resultCount: " + (d.getElementById("resultCount")
                  ? d.getElementById("resultCount").textContent.replace(/\s+/g, " ").trim()
                  : "(no element)"));
            mbox.value = "";
            mbox.dispatchEvent(new w.Event("input", { bubbles: true }));
            await sleep(500);
            log("cleared cards: " + d.querySelectorAll(".product-card").length);
          }
          // Sort + wishlist delegation on mobiles
          var msel = d.getElementById("sidebarSort") || d.getElementById("sortSelect");
          if (msel) {
            msel.value = "low-to-high";
            msel.dispatchEvent(new w.Event("change", { bubbles: true }));
            await sleep(200);
            var mfirst = d.querySelector(".product-card .product-price");
            log("sorted first: " + (mfirst ? mfirst.textContent : "none"));
          }
        }

        log("errors after tests: " + (window.__errs.length ? window.__errs.join(" | ") : "none"));
        log("DONE");
      } catch (e) {
        log("ERROR: " + e.message + " | " + (e.stack || ""));
      }
    };
    run();
  });

  f.src = page;
})();
</script>
</body>
</html>
