<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>category routing check</title>
<style>body{margin:0;font:11px monospace}#f{position:absolute;left:-99999px;top:0}#r{white-space:pre-wrap}</style>
</head><body><div id="f"></div><pre id="r">PENDING</pre>
<script>
/* Slugs taken from the index page category grid, plus the alias forms the
   user asked for by name. */
var CASES=[
 "category.html?type=laptops","category.html?type=tvs","category.html?type=refrigerators",
 "category.html?type=washing-machines","category.html?type=ac",
 "category.html?type=air-conditioners","category.html?type=kitchen",
 "category.html?type=smartwatches","category.html?type=furniture",
 "mobiles.html",
 "category.html?type=wardrobes","category.html?type=microwaves"
];
var host=document.getElementById("f"),out=document.getElementById("r");
var lines=[],i=0;
function next(){
  if(i>=CASES.length){ out.textContent=lines.join("\n"); return; }
  var u=CASES[i++],f=document.createElement("iframe");
  f.style.cssText="width:900px;height:900px;border:0";f.width=900;f.height=900;
  var done=false;
  function go(){ if(done)return; done=true;
    try{ run(u,f); }catch(e){ lines.push(u+" ERROR "+e.message); }
    if(f.parentNode)f.parentNode.removeChild(f);
    setTimeout(next,30);
  }
  f.onload=function(){ setTimeout(go,1500); };
  f.onerror=function(){ setTimeout(go,60); };
  f.src=u; host.appendChild(f);
  setTimeout(function(){ if(!done)go(); },9000);
}
function run(u,f){
  var d=f.contentDocument,w=f.contentWindow;
  var title=(d.getElementById("headerTitle")||{}).textContent||"?";
  var notFound=d.getElementById("notFound")||d.querySelector(".not-found");
  var nfShown=notFound?w.getComputedStyle(notFound).display!=="none":false;
  var empty=d.querySelector(".empty-category");
  var cards=d.querySelectorAll(".product-card").length;
  var state = nfShown ? "NOT FOUND" : (empty ? "EMPTY-STATE" : (cards>0?"LIST("+cards+")":"?"));
  var para=empty?(empty.querySelector("p")||{}).textContent:"";
  var wa=empty?empty.querySelector("a"):null;
  var waOk=false, waTxt="";
  if(wa){ waTxt=(wa.getAttribute("href")||"").split("text=")[1]||"";
    try{ waTxt=decodeURIComponent(waTxt); }catch(e){}
    waOk=/wa\.me\/919009909002/.test(wa.getAttribute("href")||""); }
  var iconGlyph=empty?(empty.querySelector(".empty-category-emoji i")||empty.querySelector(".empty-category-emoji")).getBoundingClientRect().width:0;
  lines.push(u);
  lines.push("   header=\""+(title||"").trim()+"\"  state="+state);
  if(para) lines.push("   copy: \""+para.replace(/\s+/g," ").trim()+"\"");
  if(wa) lines.push("   wa number ok="+waOk+"  msg=\""+waTxt.replace(/\s+/g," ").slice(0,72)+"\"");
  lines.push("   emoji rendered="+(iconGlyph>0.1));
}
next();
</script></body></html>
